    <meta charset="UTF-8" />

    <title>REG – Mobile Workflow</title>

    <style>
      body {
        margin: 0;
        background: #fff;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial,
          sans-serif;
      }

      /* Container principal du workflow */
      .workflow-container {
        position: relative;
        width: 100%;
        max-width: 390px;
        margin: 0 auto;
        /* ratio du SVG: 242.25 x 881.999 -> ~ 0.2746 */
        aspect-ratio: 242.25 / 881.999977;
        overflow: hidden;
        background: #fff;
      }

      /* SVG en fond (path) */
      .workflow-path {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 0;
      }

      /* Assets au-dessus */
      .asset {
        position: absolute;
        transform: translate(-50%, -50%);
        height: auto;
        z-index: 2;
        pointer-events: none;
      }

      /* helpers */
      .tiny {
        width: 6%;
      }
      .small {
        width: 14%;
      }
      .med {
        width: 22%;
      }
      .large {
        width: 30%;
      }
      .xl {
        width: 40%;
      }

      /* Step badges (C2 + number) */
      .badge-ring {
        z-index: 4;
        width: 7.5%;
      }
      .badge-num {
        z-index: 5;
        width: 2.5%;
      }

      /* =========================
   WORKFLOW ANIMATION (MOBILE)
   - draw path
   - reveal assets async
========================= */

      /* 1) Draw effect for the main path */
      .workflow-path path {
        /* JS va set dasharray/dashoffset */
        will-change: stroke-dashoffset;
      }

      /* 2) Assets reveal (global) */
      .asset {
        opacity: 0;
        transform: translate(-50%, -50%) translateY(10px);
        animation: assetIn 700ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        animation-delay: var(--d, 0s);
      }

      /* keyframes */
      @keyframes assetIn {
        to {
          opacity: 1;
          transform: translate(-50%, -50%) translateY(0);
        }
      }

      /* 3) SVG green nodes reveal (optional async) */
      #flow-nodes circle {
        opacity: 0;
        animation: nodeIn 500ms ease forwards;
        animation-delay: var(--nd, 0s);
      }
      @keyframes nodeIn {
        to {
          opacity: 0.95;
        }
      }

      /* 4) Timing map (NO HTML changes): set delays per asset by src */
      img[src='Workflow.png'] {
        --d: 0s;
      }

      img[src='C1.png'],
      img[src='t2.png'] {
        --d: 0.5s;
      }
      img[src='L2.png'] {
        --d: 0.9s;
      }

      img[src='C2.png'][alt='Step ring'].n0 {
        --d: 2.1s;
      }
      img[src='C2.png'][alt='Step ring'].n1 {
        --d: 1.4s;
      }
      img[src='C2.png'][alt='Step ring'].n2 {
        --d: 4.2s;
      }
      img[src='C2.png'][alt='Step ring'].n3 {
        --d: 6.8s;
      }
      img[src='C2.png'][alt='Step ring'].n4 {
        --d: 7s;
      }
      img[src='C2.png'][alt='Step ring'].n5 {
        --d: 8s;
      }

      img[src='2.png'][alt='2'] {
        --d: 1.38s;
      }
      img[src='Manual.png'] {
        --d: 1.43s;
      }
      img[src='t4.png'] {
        --d: 1.55s;
      }

      img[src='L1.png'] {
        --d: 1.9s;
      }
      img[src='1.png'][alt='1'],
      img[src='Stockpile.png'] {
        --d: 2.1s;
      }
      img[src='t3.png'] {
        --d: 2.25s;
      }

      img[src='waste.png'] {
        --d: 3.6s;
      }

      img[src='t1.png'],
      img[src='allwood.png'],
      img[src='L5.png'] {
        --d: 3.8s;
      }

      img[src='3.png'][alt='3'],
      img[src='Mechanical.png'],
      img[src='tf.png'],
      img[src='L6_rotated.png'] {
        --d: 4.2s;
      }

      img[src='L7.png'],
      img[src='Clean-Concrete-Fraction.png'] {
        --d: 4.8s;
      }
      img[src='L7.png'],
      img[src='Clean-Concrete-Fraction.png'].next {
        --d: 5.2s;
      }

      img[src='4.png'][alt='4'],
      img[src='8050D(080mm).png'],

        --d: 6.8s;
      }

        --d: 7s;
      }

        --d: 8s;
      }

      img[src='Layer8.png'] {
        /* --d: 8.6s; */
        --d: 7s;
      }
      img[src='./10.png'],
      img[src='Layer11.png'] {
        --d: 7.2s;
      }

      img[src='Layer12.png'] {
        --d: 8s;
      }
      img[src='Layer13.png'] {
        --d: 8s;
      }
      img[src='Layer17.png'] {
        --d: 8s;
      }
      img[src='Layer14.png'],
      img[src='Layer16.png'] {
        --d: 8.6s;
      }
      img[src='Layer15.png'] {
        --d: 9.2s;
      }

      /* Arrows timing (adapt if you want earlier/later) */
      img[src='fleche3.png'] {
        --d: 3.9s;
      }
      img[src='fleche3.png'][alt='arrow3'] {
        --d: 6.9s;
      }
      img[src='fleche3.png'][alt='arrow4'] {
        --d: 7.2s;
      }
      img[src='flech4.png'] {
        --d: 6.95s;
      }
      img[src='fleche6.png'] {
        --d: 3.9s;
      }
      /* 5) Node delays by nth-child (no HTML change) */
      #flow-nodes circle:nth-child(1) {
        --nd: 0.9s;
      }
      #flow-nodes circle:nth-child(2) {
        --nd: 1.4s;
      }
      #flow-nodes circle:nth-child(3) {
        --nd: 2s;
      }
      #flow-nodes circle:nth-child(4) {
        --nd: 2.8s;
      }
      #flow-nodes circle:nth-child(5) {
        --nd: 3.8s;
      }
      #flow-nodes circle:nth-child(6) {
        --nd: 4.6s;
      }
      #flow-nodes circle:nth-child(7) {
        --nd: 5.3s;
      }
      #flow-nodes circle:nth-child(8) {
        --nd: 6.8s;
      }
      #flow-nodes circle:nth-child(9) {
        --nd: 7.2s;
      }

      /* Accessibility: reduce motion */
      @media (prefers-reduced-motion: reduce) {
        .asset {
          animation: none;
          opacity: 1;
          transform: translate(-50%, -50%);
        }
        #flow-nodes circle {
          animation: none;
          opacity: 0.95;
        }
      }
      /* Background path (static) */
      .workflow-path .path-bg {
        opacity: 0.22;
      }

      /* Animated segments */
      .workflow-path .path-seg {
        will-change: stroke-dashoffset;
        opacity: 1;
      }
      /* GLOBAL PLAY/PAUSE */
      :root {
        --play: running; /* running | paused */
      }
      .asset,
      #flow-nodes circle {
        animation-play-state: var(--play);
      }
      /* Le path "background" devient blanc (comme le fond) */
      .workflow-path .path-bg {
        stroke: #fff !important;
        opacity: 1 !important;
      }
    </style>

      ;(function () {
        const prefersReduced = window.matchMedia(

        const container = document.querySelector('.workflow-container')
        const svg = document.querySelector('.workflow-path')
        const path = document.getElementById('mainPath')
        if (!container || !svg || !path) return

        // global play/pause via CSS
        const setGlobalPlayState = (running) => {
          document.documentElement.style.setProperty(
            '--play',
            running ? 'running' : 'paused',
          )
        }

        // ================
        // BUILD + ANIMATE PATH SEGMENTS (your logic + we STORE animations)
        // ================
        const nodes = svg.querySelector('#flow-nodes')
        const d = path.getAttribute('d') || ''
        if (!nodes || !d.trim()) return

        // original path becomes background
        path.classList.add('path-bg')
        path.removeAttribute('mask')
        svg.insertBefore(path, nodes)

        const parts = d
          .split(/(?=M\s)/g)
          .map((s) => s.trim())
          .filter(Boolean)

        const stroke = path.getAttribute('stroke') || '#1e9040'
        const strokeWidth = path.getAttribute('stroke-width') || '2'
        const linecap = path.getAttribute('stroke-linecap') || 'round'
        const linejoin = path.getAttribute('stroke-linejoin') || 'round'

        const NS = 'http://www.w3.org/2000/svg'

        const mkTemp = (segD) => {
          const p = document.createElementNS(NS, 'path')
          p.setAttribute('d', segD)
          const len = p.getTotalLength()
          const s = p.getPointAtLength(0)
          const e = p.getPointAtLength(len)
          return { d: segD, len, s, e }
        }
        const segs = parts.map(mkTemp)

        const segTopMetric = (seg) => Math.min(seg.s.y, seg.e.y)
        let startIdx = 0
        for (let i = 1; i < segs.length; i++) {
          if (segTopMetric(segs[i]) < segTopMetric(segs[startIdx])) startIdx = i
        }

        const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y)

        const used = new Array(segs.length).fill(false)
        const ordered = []

        const delta = 0.75
        const vec = (a, b) => ({ x: b.x - a.x, y: b.y - a.y })
        const dot = (u, v) => u.x * v.x + u.y * v.y
        const mag = (u) => Math.hypot(u.x, u.y) || 1
        const cosSim = (u, v) => dot(u, v) / (mag(u) * mag(v))

        const segOutDir = (seg) => {
          const p = document.createElementNS(NS, 'path')
          p.setAttribute('d', seg.d)
          const L = p.getTotalLength()
          const a = p.getPointAtLength(Math.min(delta, L))
          const b = p.getPointAtLength(0)
          return vec(b, a)
        }
        const segInDir = (seg) => {
          const p = document.createElementNS(NS, 'path')
          p.setAttribute('d', seg.d)
          const L = p.getTotalLength()
          const a = p.getPointAtLength(Math.max(0, L - delta))
          const b = p.getPointAtLength(L)
          return vec(a, b)
        }

        used[startIdx] = true
        ordered.push({ idx: startIdx, reversed: false })

        let current = segs[startIdx].e
        let currentDir = segInDir(segs[startIdx])

        for (let step = 1; step < segs.length; step++) {
          let best = -1
          let bestRev = false
          let bestScore = Infinity

          for (let i = 0; i < segs.length; i++) {
            if (used[i]) continue

            const ds = dist(current, segs[i].s)
            const dirA = segOutDir(segs[i])
            const alignA = cosSim(currentDir, dirA)
            const scoreA = ds + (1 - alignA) * 12

            const de = dist(current, segs[i].e)
            const dirB0 = segInDir(segs[i])
            const dirB = { x: -dirB0.x, y: -dirB0.y }
            const alignB = cosSim(currentDir, dirB)
            const scoreB = de + (1 - alignB) * 12

            if (scoreA < bestScore) {
              bestScore = scoreA
              best = i
              bestRev = false
            }
            if (scoreB < bestScore) {
              bestScore = scoreB
              best = i
              bestRev = true
            }
          }

          used[best] = true
          ordered.push({ idx: best, reversed: bestRev })

          if (!bestRev) {
            current = segs[best].e
            currentDir = segInDir(segs[best])
          } else {
            current = segs[best].s
            const d0 = segOutDir(segs[best])
            currentDir = { x: -d0.x, y: -d0.y }
          }
        }

        // Snap orientation
        const EPS = 2.5
        let curPoint = ordered[0].reversed
          ? segs[ordered[0].idx].s
          : segs[ordered[0].idx].e
        for (let k = 1; k < ordered.length; k++) {
          const i = ordered[k].idx
          const ds = dist(curPoint, segs[i].s)
          const de = dist(curPoint, segs[i].e)
          if (ds + EPS < de) ordered[k].reversed = false
          else if (de + EPS < ds) ordered[k].reversed = true
          curPoint = ordered[k].reversed ? segs[i].s : segs[i].e
        }
        // ✅ FORCE orientation for very bottom segments (final branches)
        // - vertical: top -> bottom
        // - horizontal: left -> right
        const isBottomZone = (seg) => {
          const maxY = Math.max(seg.s.y, seg.e.y)
          const minY = Math.min(seg.s.y, seg.e.y)
          // bottom area of your 0..882 viewBox
          return maxY > 820 || (maxY > 760 && minY > 700)
        }

        for (let k = 0; k < ordered.length; k++) {
          const i = ordered[k].idx
          const seg = segs[i]
          if (!isBottomZone(seg)) continue

          const dx = seg.e.x - seg.s.x
          const dy = seg.e.y - seg.s.y

          // mostly vertical
          if (Math.abs(dy) >= Math.abs(dx)) {
            const topToBottom = seg.s.y <= seg.e.y
            ordered[k].reversed = !topToBottom
          } else {
            // mostly horizontal
            const leftToRight = seg.s.x <= seg.e.x
            ordered[k].reversed = !leftToRight
          }
        }

        // Create animated group
        const g = document.createElementNS(NS, 'g')
        svg.insertBefore(g, nodes)

        const segEls = ordered.map(({ idx }) => {
          const p = document.createElementNS(NS, 'path')
          p.setAttribute('d', segs[idx].d)
          p.setAttribute('fill', 'none')
          p.setAttribute('stroke', stroke)
          p.setAttribute('stroke-width', strokeWidth)
          p.setAttribute('stroke-linecap', linecap)
          p.setAttribute('stroke-linejoin', linejoin)
          p.classList.add('path-seg')
          g.appendChild(p)
          return p
        })

        // Animate segments and STORE animation objects
        const lengths = segEls.map((p) => p.getTotalLength())
        const totalLen = lengths.reduce((a, b) => a + b, 0) || 1

        const pathAnimations = []
        let delaySum = 0

        ordered.forEach(({ reversed }, k) => {
          const p = segEls[k]
          const len = Math.max(0.0001, lengths[k])

          p.style.strokeDasharray = `${len}`
          const from = reversed ? -len : len
          p.style.strokeDashoffset = `${from}`

          const dur = Math.max(80, (len / totalLen) * TOTAL_MS)

          const anim = p.animate(
            [{ strokeDashoffset: from }, { strokeDashoffset: 0 }],
            {
              duration: dur,
              delay: delaySum,
              easing: EASING,
              fill: 'forwards',
            },
          )

          pathAnimations.push(anim)
          delaySum += dur
        })

        // ================
        // AUTO SCROLL (STORE RAF state)
        // ================
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v))
        const easeInOut = (x) =>
          x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2

        function getScrollRange() {
          const rect = container.getBoundingClientRect()
          const top = window.scrollY + rect.top
          const bottom = top + rect.height
          const maxY = bottom - window.innerHeight + 8
          return { top, maxY }
        }

        let running = true
        let rafId = 0
        let t0 = performance.now()
        let pausedAt = 0

        function step(now) {
          if (!running) return

          const { top, maxY } = getScrollRange()
          const p = clamp((now - t0) / SCROLL_TOTAL_MS, 0, 1)
          const pe = easeInOut(p)
          window.scrollTo(0, top + (maxY - top) * pe)

          if (p < 1) rafId = requestAnimationFrame(step)
          else {
            // finished -> Play should reload
            btn.textContent = '↻ Replay'
            running = false
          }
        }

        function startScrollFromZero() {
          const { top } = getScrollRange()
          window.scrollTo(0, top)
          t0 = performance.now()
          running = true
          rafId = requestAnimationFrame(step)
        }

        function pauseScroll() {
          running = false
          cancelAnimationFrame(rafId)
          pausedAt = performance.now()
        }

        function resumeScroll() {
          const pauseDuration = performance.now() - pausedAt
          t0 += pauseDuration
          running = true
          rafId = requestAnimationFrame(step)
        }

        // ================
        // PLAY/STOP BUTTON
        // ================
        const btn = document.createElement('button')
        btn.type = 'button'
        btn.textContent = '⏸ Stop'
        Object.assign(btn.style, {
          position: 'fixed',
          right: '14px',
          bottom: '14px',
          zIndex: 9999,
          padding: '10px 12px',
          borderRadius: '999px',
          border: '1px solid rgba(0,0,0,0.12)',
          background: 'rgba(255,255,255,0.92)',
          backdropFilter: 'blur(6px)',
          boxShadow: '0 8px 24px rgba(0,0,0,0.12)',
          font: '600 14px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif',
        })
        document.body.appendChild(btn)

        // helper: check if finished
        const isFinished = () => {
          // if last animation is finished or scroll ended
          const last = pathAnimations[pathAnimations.length - 1]
          return last && last.playState === 'finished'
        }

        function pauseAll() {
          setGlobalPlayState(false) // assets + nodes
          pathAnimations.forEach((a) => a.pause())
          pauseScroll()
          btn.textContent = '▶︎ Play'
        }

        function resumeAll() {
          setGlobalPlayState(true)
          pathAnimations.forEach((a) => a.play())
          resumeScroll()
          btn.textContent = '⏸ Stop'
        }

        function reloadFromZero() {
          // full restart: simplest and stable
          location.reload()
        }

        btn.addEventListener('click', () => {
          // If finished -> replay = reload
          if (isFinished()) {
            reloadFromZero()
            return
          }

          // toggle pause/resume
          const anyRunning = pathAnimations.some(
            (a) => a.playState === 'running',
          )
          if (anyRunning) pauseAll()
          else resumeAll()
        })

        // ================
        // AUTO START on page load
        // ================
        // start at top of container
        const { top } = getScrollRange()
        window.scrollTo(0, top)

        setGlobalPlayState(true)
        // ensure path anims are running already (they are)
        startScrollFromZero()
      })()
    </script>
  </body>
</html>
