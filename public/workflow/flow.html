    <script>
      document.addEventListener('DOMContentLoaded', () => {
        function smartClose() {
          window.close()
          history.back()
        }
        const svg = document.querySelector('svg')
        const images = svg.querySelectorAll('image')

        if (!svg || images.length === 0) return

        // lock lowel
        document.body.style.overflow = 'hidden'

        const viewportBottom = window.innerHeight
        let nearestImage = null
        let minDist = Infinity

        images.forEach((img) => {
          const rect = img.getBoundingClientRect()
          const dist = Math.abs(rect.bottom - viewportBottom)
          if (dist < minDist) {
            minDist = dist
            nearestImage = img
          }
        })

        if (!nearestImage) return

        const setTag = nearestImage.querySelector('set')
        let delayMs = 0
        if (setTag) {
          const begin = parseFloat(setTag.getAttribute('begin')) || 0
          delayMs = begin * 1000
        }
        function autoScroll(speed = 1) {
          if (
            window.scrollY + window.innerHeight >=
            document.body.scrollHeight
          ) {
            document.body.style.overflow = 'auto'
            return
          }
          window.scrollBy(0, speed)
          requestAnimationFrame(() => autoScroll(speed))
        }

        setTimeout(() => {
          autoScroll(3)
        }, delayMs)
      })
    </script>
    <script>
      function smartClose() {
        window.close()
        history.back()
      }
    </script>
  </body>
</html>
